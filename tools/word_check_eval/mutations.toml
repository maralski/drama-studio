file = 'Sources/DramaEngine/Verification/EnglishSpokenForms.json'
old = '''
    "cl": "centiliter",
'''
new = '''
    "cl": "centiliter",
    "decameter": "decameter",
'''

[[mutation]]
name = 'units named before spellings'
file = 'Sources/DramaEngine/Verification/EnglishNumbers.swift'
old = 'let spoken = afterNumber ? forms.units[spelled] ?? spelled : spelled'
new = 'let spoken = afterNumber ? forms.units[word] ?? spelled : spelled'

[[mutation]]
name = 'speaker tag is a cue'
file = 'Sources/DramaEngine/Verification/WordCoverage.swift'
old = '#"\[[^\[\]]*\]|</?[A-Za-z][^<>]*>|"#'
new = '#"\[[^\[\]]*\]|<[^<>]*>|"#'

[[mutation]]
name = 'only fixed cues enable fillers'
file = 'Sources/DramaEngine/Verification/WordCoverage.swift'
old = 'cue.firstMatch(in: line, range: NSRange(line.startIndex..., in: line)) != nil'
new = 'line.range(of: #"\[(?:laugh[^\]]*|sigh[^\]]*|gasp[^\]]*|cough[^\]]*|clears throat)\]"#, options: [.regularExpression, .caseInsensitive]) != nil'

[[mutation]]
name = 'oh is no filler'
file = 'Sources/DramaEngine/Verification/EnglishSpokenForms.json'
old = '''
    "oh",
'''
new = ''

[[mutation]]
name = 'any parenthesis is a direction'
file = 'Sources/DramaEngine/Verification/WordCoverage.swift'
old = '"\\(\\s*(?:" + alternation(englishForms.direction_words) + #")'
new = '''"\\(\\s*(?:" + #"[\p{L}']+"# + #")'''

[[mutation]]
name = 'a long parenthesis is a direction'
file = 'Sources/DramaEngine/Verification/WordCoverage.swift'
old = '''(?:[\s-]+[\p{L}']+){0,3}'''
new = '''(?:[\s-]+[\p{L}']+){0,9}'''

[[mutation]]
name = 'directions stay in the expected words'
file = 'Sources/DramaEngine/Verification/WordCoverage.swift'
old = '''
return tokens(directionPattern.stringByReplacingMatches(in: spoken, range: NSRange(location: 0, length: ns.length), withTemplate: " "),
                      locale: locale, profile: .script)'''
new = 'return tokens(spoken, locale: locale, profile: .script)'
